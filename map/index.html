<style>
:root{
  --bg:#EEF0EE; --panel:#FFFFFF; --ink:#1B2226; --muted:#5B676D; --line:#D3D9D7; --soft:#E9EDEB;
  --grey:#8A9499; --yellow:#E8B400; --blue:#2463C7; --green:#1E9E55; --red:#D8342C;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --bg:#121719; --panel:#1A2124; --ink:#E6EBEA; --muted:#98A5AA; --line:#2E393D; --soft:#232C30; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:grid;grid-template-columns:360px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:18px 16px;display:grid;gap:16px;align-content:start}
h1{font:700 22px/1.15 var(--f-head);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
#map{height:100%;min-height:360px}
.leg{display:grid;gap:6px}
.leg label{display:grid;grid-template-columns:auto 18px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.leg label:hover{background:var(--soft)}
.sw{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.cities{display:flex;gap:6px;flex-wrap:wrap}
.cities button{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.cities button:hover{background:var(--soft)}
h2{font:700 15px var(--f-head);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.ok{color:var(--green);font-weight:600} td.no{color:var(--red);font-weight:600}
tr[data-lat]{cursor:pointer} tr[data-lat]:hover{background:var(--soft)}
.note{font-size:12.5px;color:var(--muted)}
.leaflet-popup-content{margin:10px 12px;font:13px/1.4 var(--f-body)}
.pop b{font-size:14px} .pop img{display:block;width:240px;max-width:100%;border-radius:6px;margin-top:6px}
.pop .m{color:#5B676D}
@media (max-width:820px){ body{grid-template-columns:1fr;grid-template-rows:auto 60vh} aside{border-right:0;border-bottom:1px solid var(--line);max-height:none} }
</style>

const LAYERS = [
  ["base", "Первый обход — все щиты", "--grey"],
  ["tour", "Второй обход — все щиты", "--yellow"],
  ["base_uzum", "Первый обход — Uzum Bank", "--blue"],
  ["tour_uzum", "Второй обход — Uzum Bank", "--green"],
  ["plan_missing", "План Uzum Bank — не найдено ни одним обходом", "--red"],
];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const map = L.map("map", {preferCanvas: false}).setView([40.115, 65.37], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);

const groups = {};
const order = {base: 1, tour: 2, base_uzum: 3, tour_uzum: 4, plan_missing: 5};   // важные — сверху
LAYERS.forEach(([k]) => groups[k] = L.layerGroup().addTo(map));
[...DATA.points].sort((a, b) => order[a.layer] - order[b.layer]).forEach(p => {
  const big = p.layer !== "base" && p.layer !== "tour";
  const color = css(LAYERS.find(l => l[0] === p.layer)[2]);
  const m = L.circleMarker([p.lat, p.lon], {radius: p.layer === "plan_missing" ? 11 : big ? 8 : 5, color: "#fff",
    weight: big ? 2 : 1, fillColor: color, fillOpacity: big ? .95 : .8});
  m.bindPopup(`<div class="pop"><b>${esc(p.title)}</b><div class="m">${esc(p.sub)}</div><div>${esc(p.note)}</div>
    ${p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy">` : ""}
    <div class="m"><a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</a></div></div>`,
    {maxWidth: 270});
  m.addTo(groups[p.layer]);
});

const S = DATA.stats, counts = {base: S.base_total, tour: S.tour, base_uzum: S.base_uzum, tour_uzum: S.tour_uzum, plan_missing: S.plan_missing};
document.getElementById("legend").innerHTML = LAYERS.map(([k, label, v]) =>
  `<label><input type="checkbox" data-k="${k}" checked><span class="sw" style="background:var(${v})"></span><span>${label}</span><span class="cnt">${counts[k]}</span></label>`).join("");
document.getElementById("legend").addEventListener("change", e => {
  const k = e.target.dataset.k; if (!k) return;
  // «все щиты 1-го обхода» включает и синие: серый слой — это щиты без Uzum Bank
  e.target.checked ? groups[k].addTo(map) : map.removeLayer(groups[k]);
});

document.querySelector("#plan tbody").innerHTML = DATA.plan.map(r =>
  `<tr data-lat="${r.lat}" data-lon="${r.lon}"><td>${esc(r.city)} · ${esc(r.addr)}</td>
   <td class="${r.found1 ? "ok" : "no"}">${r.found1 ? "да" : "нет"}</td>
   <td class="${r.found2 ? "ok" : "no"}">${r.found2 ? "да" : r.visited2 > 300 ? "не был" : "нет"}</td></tr>`).join("");
document.querySelector("#plan tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-lat]"); if (tr) map.setView([+tr.dataset.lat, +tr.dataset.lon], 17);
});
document.getElementById("nocoords").textContent = "Без координат, на карте нет: " + DATA.plan_no_coords.join("; ") +
  ". По первому обходу из этих остановок подтверждены максимум две.";
document.getElementById("foot").textContent = `Серый слой — щиты первого обхода без Uzum Bank (${S.base}), синий — с Uzum Bank (${S.base_uzum}). ` +
  `Ещё ${S.base_nogeo} конструкций первого обхода без координат. Зелёные точки — по каждому кадру с Uzum Bank. ` +
  `«Не был» — второй обход не проезжал ближе 300 м. Нажмите на строку плана, чтобы приблизить.`;

const fit = f => map.fitBounds(DATA.points.filter(f).map(p => [p.lat, p.lon]), {padding: [20, 20]});
const VIEWS = {nav: p => p.lon > 65.2 && p.lon < 65.6 && p.lat > 40 && p.lat < 40.25,
               jiz: p => p.lon > 67.7 && p.lon < 68 && p.lat > 40 && p.lat < 40.25, all: () => true};
document.querySelector(".cities").addEventListener("click", e => { const c = e.target.dataset.c; if (c) fit(VIEWS[c]); });
fit(VIEWS.nav);
